      {sheet === "threads" && <PSheet onClose={closeSheet} title={`スレッド ${threads.length} 件`}>

          setNote(""); setSheet(null);

      </PSheet>}

      {sheet === "new" && <PSheet onClose={closeSheet} title="作る"><Item a="会話を始める" b="" onClick={() => { setSheet(null); go({ p: "newconv" }); }} /><Item a="issue を作る" b="" onClick={() => { setSheet(null); go({ p: "new" }); }} /></PSheet>}
      {msg && <div role="status" className={`absolute left-3 right-3 z-30 ${sheet ? "top-16" : "bottom-24"} rounded-lg bg-ink text-ground px-3 py-2 text-[14px] shadow-float flex items-center gap-2`}><span className="flex-1">{msg.t}</span>{msg.undo && <button className="font-bold underline h-11 px-3" onClick={() => { const u = msg.undo; setMsg(null); u(); }}>取り消す</button>}</div>}
      {["inbox", "projects", "search"].includes(s.p) && (
        <nav className="h-14 border-t border-line bg-surface grid grid-cols-3 shrink-0">
          {tabs.map(([id, label, d]) => (
            <button key={id} onClick={() => go({ p: id })} aria-current={s.p === id ? "page" : undefined} className={`flex flex-col items-center justify-center text-[12px] font-medium relative ${s.p === id ? "text-accent" : "text-muted"}`}>
              <Icon d={d} />{label}{id === "inbox" && judge > 0 && <span className="absolute top-1 left-1/2 ml-2 min-w-[18px] h-[18px] rounded-full bg-wait text-ground text-[12px] font-bold grid place-items-center px-1">{judge}</span>}
            </button>))}
        </nav>
      )}
    </div>
  );
}
