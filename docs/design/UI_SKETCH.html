      </PSheet>}
      {(sheet === "質問" || sheet === "指示" || sheet === "reject") && <PSheet onClose={closeSheet} title={sheet === "reject" ? "差し戻す指摘" : `${sheet}を書く`}>
        {sel && sheet !== "reject" && <p className="text-[12px] text-muted border-l-2 border-line pl-2 mb-2">{P_AI.find((x) => x[0] === sel)[1]}</p>}

        <button disabled={!note.trim()} className="mt-2 w-full h-12 rounded-lg bg-accent text-ground font-bold disabled:opacity-40" onClick={() => {

          setNote(""); setSheet(null);

      </PSheet>}
      {sheet === "attach" && <PSheet onClose={closeSheet} title="足す"><Item a="画像" b="写真・スクリーンショット" onClick={() => setSheet(null)} /><Item a="スキル" b="/dev-spec など" onClick={() => { setDraft("/dev-spec "); setSheet(null); }} /></PSheet>}
      {sheet === "new" && <PSheet onClose={closeSheet} title="作る"><Item a="会話を始める" b="プロジェクトを選ぶ" onClick={() => { setSheet(null); go({ p: "projects" }); }} /><Item a="issue を作る" b="" onClick={() => { setSheet(null); go({ p: "new" }); }} /></PSheet>}
      {msg && <div role="status" className={`absolute left-3 right-3 z-30 ${sheet ? "top-16" : "bottom-24"} rounded-lg bg-ink text-ground px-3 py-2 text-[14px] shadow-float flex items-center gap-2`}><span className="flex-1">{msg.t}</span>{msg.undo && <button className="font-bold underline h-8 px-2" onClick={() => { const u = msg.undo; setMsg(null); u(); }}>取り消す</button>}</div>}
      {["inbox", "projects", "search"].includes(s.p) && (
        <nav className="h-14 border-t border-line bg-surface grid grid-cols-3 shrink-0">
          {tabs.map(([id, label, d]) => (
            <button key={id} onClick={() => go({ p: id })} aria-current={s.p === id ? "page" : undefined} className={`flex flex-col items-center justify-center text-[12px] font-medium relative ${s.p === id ? "text-accent" : "text-muted"}`}>
              <Icon d={d} />{label}{id === "inbox" && judge > 0 && <span className="absolute top-1 left-1/2 ml-2 min-w-[18px] h-[18px] rounded-full bg-wait text-ground text-[12px] font-bold grid place-items-center px-1">{judge}</span>}
            </button>))}
        </nav>
      )}
    </div>
  );
}
